<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Form Pendaftaran Coding Club - SMK Tunas Media</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-6">
  <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-lg border border-slate-700">
    <h1 class="text-2xl font-bold text-sky-400 text-center mb-2">Pendaftaran Coding Club</h1>
    <p class="text-sm text-slate-400 text-center mb-6">SMK Tunas Media - Tahun Ajaran 
2026/2027</p>
    <form id="registrationForm" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-300">Nama Lengkap Siswa</
label>
        <input type="text" id="fullName" required class="w-full bg-slate-900 border border
slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500" 
placeholder="Masukkan nama lengkap">
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-300">NIS / NISN</label>
          <input type="text" id="nis" required class="w-full bg-slate-900 border border
slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-sky-500" 
placeholder="Nomor Induk">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1 text-slate-300">Kelas</label>
          <select id="studentClass" class="w-full bg-slate-900 border border-slate-700 rounded
lg p-2.5 text-white focus:outline-none focus:border-sky-500">
            <option value="XI RPL">XI RPL</option>
            <option value="XI PPLG">XI PPLG</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1 text-slate-300">Minat Divisi 
Development</label>
        <select id="division" class="w-full bg-slate-900 border border-slate-700 rounded-lg 
p-2.5 text-white focus:outline-none focus:border-sky-500">
          <option value="Web Frontend">Web Frontend (Tailwind/JS)</option>
          <option value="Web Backend">Web Backend (Node.js/API)</option>
          <option value="Mobile App">Mobile Application</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold 
py-2.5 rounded-lg transition duration-200">Daftar Sekarang</button>
    </form>
    <div id="resultCard" class="hidden mt-6 p-4 bg-slate-950 border border-emerald-500 rounded
lg text-emerald-400 text-sm">
      <h3 class="font-bold mb-1">✓ Pendaftaran Berhasil!</h3>
      <p id="resultDetails"></p>
    </div>
  </div>
  <script src="app.js"></script>
  </body>
</html>
